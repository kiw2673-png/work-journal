<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지사별 대리점 지도 데모</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f0f0}
#mapWrap{width:100%;height:100vh;display:flex;flex-direction:column}
#topBar{background:linear-gradient(135deg,#1a3a5c,#2563eb);color:#fff;padding:10px 14px;z-index:1000;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#topBar h1{font-size:14px;font-weight:700}
#topBar .sub{font-size:10px;opacity:.7;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px}
#mapContainer{flex:1;position:relative}
#map{width:100%;height:100%}
/* 사이드 패널 */
#sidePanel{position:absolute;top:0;right:0;bottom:0;width:270px;background:#fff;box-shadow:-3px 0 12px rgba(0,0,0,.15);overflow-y:auto;z-index:900;transition:transform .25s}
#sidePanel.hidden{transform:translateX(100%)}
#toggleBtn{position:absolute;top:10px;right:280px;z-index:901;background:#fff;border:1px solid #ccc;border-radius:6px 0 0 6px;padding:7px 9px;cursor:pointer;font-size:12px;box-shadow:-2px 2px 5px rgba(0,0,0,.1);transition:right .25s;white-space:nowrap}
#toggleBtn.col{right:10px;border-radius:6px}
/* 패널 내부 */
.panelHead{padding:12px;background:linear-gradient(135deg,#1a3a5c,#2563eb);color:#fff}
.panelHead h2{font-size:13px;font-weight:700}
.panelBody{padding:10px}
.kwSep{font-size:11px;font-weight:700;padding:5px 2px 3px;border-bottom:2px solid;margin-bottom:5px;letter-spacing:.5px;margin-top:6px}
.jiRow{display:flex;align-items:center;gap:7px;padding:6px 8px;border-left:3px solid;border-radius:5px;margin-bottom:4px;cursor:pointer;background:#f8f9fb;transition:background .15s}
.jiRow:hover{background:#eef2ff}
.jiName{font-size:12px;font-weight:700}
.jiCnt{font-size:10px;font-weight:700}
.spChips{flex:1;display:flex;flex-wrap:wrap;gap:2px}
.spChip{font-size:9px;border-radius:5px;padding:1px 4px;border:1px solid}
/* 상세뷰 */
.detailHead{display:flex;align-items:center;gap:8px;padding:10px 12px}
.backBtn{font-size:11px;cursor:pointer;padding:3px 8px;border:1px solid rgba(255,255,255,.5);border-radius:5px;background:rgba(255,255,255,.18);color:#fff;font-family:inherit}
.spBlock{margin-bottom:10px}
.spTitle{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.spDot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding-left:15px}
.chip{font-size:9px;border-radius:4px;padding:2px 5px;border:1px solid}
/* 범례 */
#legend{position:absolute;bottom:20px;left:10px;z-index:800;background:rgba(255,255,255,.93);border-radius:8px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:10px;max-width:130px}
#legend .lTitle{font-weight:700;margin-bottom:5px;font-size:11px;color:#333}
.lItem{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.lDot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* 툴팁 */
.jisa-tooltip{background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:11px;font-family:-apple-system,sans-serif;white-space:nowrap}
</style>
</head>

<div id="mapWrap">

    <h1>🗺️ 지사별 대리점 지도</h1>

/* ── 좌표 변환 (SVG ↔ 위경도) ──────────────────────────────
   SVG: x=15+(lon-126)*54.3  y=10+(38.6-lat)*69
   역산: lon=126+(x-15)/54.3  lat=38.6-(y-10)/69           */
function svgLL(x,y){return[38.6-(y-10)/69, 126+(x-15)/54.3];}

/* SVG path → [[lat,lng], ...] */
function parsePath(d){
  return [...d.matchAll(/[ML]([\d.]+),([\d.]+)/g)]
    .map(m=>svgLL(parseFloat(m[1]),parseFloat(m[2])));
}

function extractCity(n){
  n=n.replace(/\(.*?\)/g,'').trim().replace(/대리점$|특약점$|지점$|판매점$/,'');
  n=n.replace(/동부$|서부$|남부$|북부$|중부$|제일$|중앙$/,'');
  return n.trim()||'기타';
}
function cityXY(name,fb){
  if(CITY_XY[name])return CITY_XY[name];
  const k=Object.keys(CITY_XY).find(k=>name.startsWith(k)&&k.length>=2);
  if(k){const[x,y]=CITY_XY[k];return[x+(name.charCodeAt(name.length-1)%7)-3,y+(name.charCodeAt(0)%7)-3];}
  return fb;
}

/* ── jisaMap 빌드 ───────────────────────────────────────── */
const jisaMap={};
JISA.forEach(j=>{jisaMap[j.name]={...j,dealers:[],spSt:{},spColors:{}};});
DEALERS.forEach(([br,nm,csr])=>{
  if(!jisaMap[br])return;
  jisaMap[br].dealers.push({name:nm,consultant:csr});
  if(!jisaMap[br].spSt[csr])jisaMap[br].spSt[csr]=[];
  jisaMap[br].spSt[csr].push({name:nm});
});
JISA.forEach(j=>{
  const spList=Object.keys(jisaMap[j.name].spSt).filter(s=>s).sort();
  spList.forEach((sp,idx)=>{jisaMap[j.name].spColors[sp]=SP_COLORS[idx%SP_COLORS.length];});
});

/* ── Leaflet 초기화 ─────────────────────────────────────── */
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([36.5,127.8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom:18
}).addTo(map);

/* ── 지사 영역 폴리곤 ──────────────────────────────────── */
const polygonLayer={};
let selectedJisa=null;

JISA.forEach(j=>{
  const latlngs=parsePath(j.d);
  const poly=L.polygon(latlngs,{
    color:j.color,
    weight:2,
    opacity:0.9,
    fillColor:j.color,
    fillOpacity:0.18
  });
  poly.bindTooltip(j.name,{
    permanent:false,sticky:true,
    className:'jisa-tooltip',
    direction:'center'
  });
  poly.on('mouseover',function(){
    if(selectedJisa!==j.name)this.setStyle({fillOpacity:0.38,weight:3});
  });
  poly.on('mouseout',function(){
    if(selectedJisa!==j.name)this.setStyle({fillOpacity:0.18,weight:2});
  });
  poly.on('click',function(){
    selectJisa(j.name);
    map.fitBounds(this.getBounds(),{padding:[30,30]});
  });
  poly.addTo(map);
  polygonLayer[j.name]=poly;
});

/* ── 대리점 마커 ───────────────────────────────────────── */
const markerLayer=L.layerGroup().addTo(map);
DEALERS.forEach(([br,nm,csr])=>{
  const ji=jisaMap[br];if(!ji)return;
  const city=extractCity(nm);
  const[sx,sy]=cityXY(city,[ji.lx,ji.ly]);
  const[lat,lng]=svgLL(sx,sy);
  const color=ji.spColors[csr]||ji.color;
  const m=L.circleMarker([lat,lng],{
    radius:6,fillColor:color,color:'#fff',weight:1.5,fillOpacity:0.92
  });
  m.bindPopup(
    '<div style="min-width:150px;font-family:-apple-system,sans-serif">'
    +'<div style="font-size:11px;color:'+ji.color+';font-weight:700;margin-bottom:3px">'+br+'</div>'
    +'<div style="font-size:13px;font-weight:700;margin-bottom:2px">'+nm+'</div>'
    +'<div style="font-size:11px;color:#666">CSR: <b style="color:'+color+'">'+csr+'</b></div>'
    +'</div>',
    {maxWidth:200}
  );
  m.on('click',()=>selectJisa(br));
  markerLayer.addLayer(m);
});

/* ── 지사 선택 ─────────────────────────────────────────── */
function selectJisa(name){
  // 이전 선택 스타일 초기화
  if(selectedJisa){
    const prev=polygonLayer[selectedJisa];
    if(prev)prev.setStyle({fillOpacity:0.18,weight:2});
  }
  selectedJisa=name;
  const poly=polygonLayer[name];
  if(poly)poly.setStyle({fillOpacity:0.45,weight:3});
  showDetail(name);
  // 패널 열기
  if(document.getElementById('sidePanel').classList.contains('hidden'))togglePanel();
}

/* ── 범례 빌드 ─────────────────────────────────────────── */
const legEl=document.getElementById('legendItems');
JISA.forEach(j=>{
  legEl.innerHTML+='<div class="lItem" onclick="selectJisa(\''+j.name+'\');map.fitBounds(polygonLayer[\''+j.name+'\'].getBounds(),{padding:[30,30]})" style="cursor:pointer">'
    +'<div class="lDot" style="background:'+j.color+'"></div>'
    +'<span style="color:#333">'+j.name+'</span>'
    +'</div>';
});

/* ── 패널: 전체 목록 ────────────────────────────────────── */
function buildOverview(){
  let h='<div class="panelHead"><h2>🗺️ 지사별 담당지역</h2></div><div class="panelBody">';
  KWANYUK.forEach(kw=>{
    h+='<div class="kwSep" style="color:'+kw.color+';border-color:'+kw.color+'">'+kw.name+'</div>';
    kw.jisas.forEach(jn=>{
      const ji=jisaMap[jn];if(!ji)return;
      const spKeys=Object.keys(ji.spSt).filter(s=>s).sort();
      const chips=spKeys.map(sp=>'<span class="spChip" style="background:'+ji.spColors[sp]+'18;border-color:'+ji.spColors[sp]+'55;color:'+ji.spColors[sp]+'">'+sp+'</span>').join('');
      h+='<div class="jiRow" style="border-color:'+ji.color+'" onclick="selectJisa(\''+jn+'\');map.fitBounds(polygonLayer[\''+jn+'\'].getBounds(),{padding:[30,30]})">'
        +'<span class="jiName" style="color:'+ji.color+'">'+jn+'</span>'
        +'<span class="jiCnt" style="color:'+ji.color+'">'+ji.dealers.length+'개</span>'
        +'<div class="spChips">'+chips+'</div>'
        +'<span style="font-size:10px;color:#bbb">▶</span>'
        +'</div>';
    });
    h+='<div style="margin-bottom:6px"></div>';
  });
  h+='</div>';
  return h;
}

/* ── 패널: 지사 상세 ────────────────────────────────────── */
function showDetail(name){
  const ji=jisaMap[name];if(!ji)return;
  const spKeys=Object.keys(ji.spSt).filter(s=>s).sort();
  let h='<div class="detailHead" style="background:'+ji.color+'">'
    +'<button class="backBtn" onclick="backToOverview()">← 전체</button>'
    +'<span style="font-weight:700;font-size:13px">'+name+'</span>'
    +'<span style="margin-left:auto;font-size:12px">'+ji.dealers.length+'개</span>'
    +'</div><div class="panelBody">';
  spKeys.forEach(sp=>{
    const color=ji.spColors[sp]||ji.color;
    const dls=ji.spSt[sp];
    h+='<div class="spBlock">'
      +'<div class="spTitle"><div class="spDot" style="background:'+color+'"></div>'
      +'<span style="font-size:12px;font-weight:700;color:'+color+'">'+sp+'</span>'
      +'<span style="font-size:10px;color:#999">('+dls.length+'개)</span></div>'
      +'<div class="chips">'+dls.map(d=>'<span class="chip" style="background:'+color+'10;border-color:'+color+'40;color:#444">'+d.name.replace(/\(.*?\)/g,'').replace(/대리점$|특약점$|지점$|판매점$/,'')+'</span>').join('')+'</div>'
      +'</div>';
  });
  h+='</div>';
  document.getElementById('panelContent').innerHTML=h;
}

function backToOverview(){
  if(selectedJisa){
    const prev=polygonLayer[selectedJisa];
    if(prev)prev.setStyle({fillOpacity:0.18,weight:2});
  }
  selectedJisa=null;
  document.getElementById('panelContent').innerHTML=buildOverview();
  map.setView([36.5,127.8],7);
}

let panelOpen=true;
function togglePanel(){
  panelOpen=!panelOpen;
  document.getElementById('sidePanel').classList.toggle('hidden',!panelOpen);
  const b=document.getElementById('toggleBtn');
  b.classList.toggle('col',!panelOpen);
  b.textContent=panelOpen?'◀ 목록':'▶ 목록';
  const r=panelOpen?'280px':'10px';
  b.style.right=r;
}

// 초기 렌더
document.getElementById('panelContent').innerHTML=buildOverview();
</script>
</body>
</html>
