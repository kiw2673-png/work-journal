*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#e8edf2}
#wrap{width:100%;height:100vh;display:flex;flex-direction:column}
#topBar{background:linear-gradient(135deg,#1a3a5c,#2563eb);color:#fff;padding:9px 14px;z-index:1000;display:flex;align-items:center;gap:8px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#topBar h1{font-size:14px;font-weight:700}
#topBar .sub{font-size:10px;opacity:.75;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:10px}
#mc{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}
/* 사이드 패널 */
#sp{position:absolute;top:0;right:0;bottom:0;width:265px;background:#fff;box-shadow:-3px 0 14px rgba(0,0,0,.18);z-index:900;display:flex;flex-direction:column;transition:transform .22s}
#sp.hide{transform:translateX(100%)}
#toggleBtn{position:absolute;top:10px;z-index:901;background:#fff;border:1px solid #ccc;padding:7px 9px;cursor:pointer;font-size:12px;box-shadow:-2px 2px 6px rgba(0,0,0,.12);white-space:nowrap;transition:right .22s,border-radius .22s;right:275px;border-radius:6px 0 0 6px}
#toggleBtn.col{right:10px;border-radius:6px}
.ph{padding:11px 12px;background:linear-gradient(135deg,#1a3a5c,#2563eb);color:#fff;flex-shrink:0}
.ph h2{font-size:13px;font-weight:700}
.ph .phSub{font-size:10px;opacity:.7;margin-top:2px}
.pb{padding:10px;overflow-y:auto;flex:1}
.kwSep{font-size:11px;font-weight:700;padding:5px 2px 3px;border-bottom:2px solid;margin:8px 0 5px;letter-spacing:.5px}
.jiRow{display:flex;align-items:center;gap:7px;padding:7px 9px;border-left:3px solid;border-radius:6px;margin-bottom:4px;cursor:pointer;background:#f8f9fb;transition:background .15s}
.jiRow:hover{background:#eef2ff}
.jiName{font-size:12px;font-weight:700;min-width:72px}
.jiCnt{font-size:10px;font-weight:700;min-width:24px}
.spW{flex:1;display:flex;flex-wrap:wrap;gap:2px}
.spC{font-size:9px;border-radius:5px;padding:1px 4px;border:1px solid}
/* 상세 */
.dh{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-shrink:0}
.bk{font-size:11px;cursor:pointer;padding:3px 8px;border:1px solid rgba(255,255,255,.45);border-radius:5px;background:rgba(255,255,255,.16);color:#fff;font-family:inherit}
.spBlk{margin-bottom:11px}
.spT{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.spDot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding-left:15px}
.chip{font-size:9px;border-radius:4px;padding:2px 5px;border:1px solid}
/* 범례 */
#leg{position:absolute;bottom:16px;left:10px;z-index:800;background:rgba(255,255,255,.95);border-radius:8px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:10px}
#leg .lTit{font-weight:700;margin-bottom:5px;font-size:11px;color:#1a3a5c}
.lI{display:flex;align-items:center;gap:5px;margin-bottom:3px;cursor:pointer;padding:1px 3px;border-radius:3px;transition:background .1s}
.lI:hover{background:#f0f0f0}
.lD{width:12px;height:10px;border-radius:2px;flex-shrink:0;opacity:.8}
/* Leaflet 툴팁 커스텀 */
.dlabel{background:rgba(255,255,255,.93)!important;border:1px solid #cbd5e1!important;border-radius:4px!important;font-size:10px!important;padding:2px 5px!important;box-shadow:0 1px 4px rgba(0,0,0,.15)!important;white-space:nowrap!important;font-family:-apple-system,sans-serif!important;pointer-events:none!important}
.dlabel::before{border-right-color:transparent!important}
.jlabel{background:rgba(255,255,255,.88)!important;border:none!important;border-radius:4px!important;font-size:11px!important;font-weight:700!important;padding:3px 7px!important;box-shadow:0 1px 5px rgba(0,0,0,.2)!important;pointer-events:none!important}
.jlabel::before{display:none!important}

function extractCity(n){
  n=n.replace(/\(.*?\)/g,'').trim().replace(/대리점$|특약점$|지점$|판매점$/,'');
  return n.replace(/동부$|서부$|남부$|북부$|중부$|제일$|중앙$/,'').trim()||'기타';
}
function cityXY(name,fb){
  if(CITY_XY[name])return CITY_XY[name];
  const k=Object.keys(CITY_XY).find(k=>name.startsWith(k)&&k.length>=2);
  if(k){const[x,y]=CITY_XY[k];return[x+(name.charCodeAt(name.length-1)%7)-3,y+(name.charCodeAt(0)%7)-3];}
  return fb;
}
function getLL(nm,city,ji){
  if(LL_OV[city])return LL_OV[city];
  return svgLL(...cityXY(city,[ji.lx,ji.ly]));
}

/* ── jisaMap 빌드 ─────────────────────────────────────── */
const jM={};
JISA.forEach(j=>{jM[j.name]={...j,dealers:[],spSt:{},spColors:{}};});
DEALERS.forEach(([br,nm,csr])=>{
  if(!jM[br])return;
  const city=extractCity(nm);
  const [lat,lng]=getLL(nm,city,jM[br]);
  const shortName=nm.replace(/\(.*?\)/g,'').replace(/대리점$|특약점$|지점$|판매점$/,'');
  jM[br].dealers.push({nm,shortName,csr,city,lat,lng});
  if(!jM[br].spSt[csr])jM[br].spSt[csr]=[];
  jM[br].spSt[csr].push({nm,shortName});
});
JISA.forEach(j=>{
  const spList=Object.keys(jM[j.name].spSt).filter(s=>s).sort();
  spList.forEach((sp,i)=>{jM[j.name].spColors[sp]=SP_COLORS[i%SP_COLORS.length];});
});

  preferCanvas:true,
  maxBounds:[[32.0,123.0],[40.0,132.0]],

}).addTo(map);

/* ── 폴리곤 생성 ──────────────────────────────────────── */
const polyLayer={};
JISA.forEach(j=>{
  const poly=L.polygon(parsePath(j.d),{
    color:j.color,weight:2,opacity:0.85,
    fillColor:j.color,fillOpacity:0.2
  });
  poly.bindTooltip(j.name,{sticky:true,direction:'center',className:'jlabel'});
  poly.on('mouseover',function(){if(sel!==j.name)this.setStyle({fillOpacity:0.38,weight:3});});
  poly.on('mouseout',function(){if(sel!==j.name)this.setStyle({fillOpacity:0.2,weight:2});});
  poly.on('click',()=>selectJisa(j.name));
  poly.addTo(map);
  polyLayer[j.name]=poly;
});

/* ── 마커 레이어 생성 ─────────────────────────────────── */
const overviewGrp={}, detailGrp={};

JISA.forEach(j=>{
  overviewGrp[j.name]=L.layerGroup();
  detailGrp[j.name]=L.layerGroup();
  const ji=jM[j.name];
  const placed={};

  ji.dealers.forEach(d=>{
    const color=ji.spColors[d.csr]||j.color;
    // 같은 좌표 오프셋
    const rk=Math.round(d.lat*200)+','+Math.round(d.lng*200);
    const n=(placed[rk]=(placed[rk]||0)+1);
    const offs=[[0,0],[0.008,-0.008],[-0.008,0.008],[0.008,0.008],[-0.008,-0.008],[0,0.012],[0,-0.012],[0.012,0],[-0.012,0]];
    const[dlat,dlng]=offs[(n-1)%9];
    const lat=d.lat+dlat, lng=d.lng+dlng;

    // 전체보기 마커 (작은 원, 호버시 이름)
    const om=L.circleMarker([lat,lng],{radius:5,fillColor:color,color:'#fff',weight:1.5,fillOpacity:0.88});
    om.bindTooltip(d.shortName,{direction:'right',offset:[6,0],className:'dlabel'});
    om.on('click',()=>selectJisa(j.name));
    overviewGrp[j.name].addLayer(om);

    // 상세보기 마커 (크고, 이름 항상 표시)
    const dm=L.circleMarker([lat,lng],{radius:7,fillColor:color,color:'#fff',weight:2,fillOpacity:0.95});
    dm.bindTooltip(d.shortName,{permanent:true,direction:'right',offset:[8,0],className:'dlabel'});
    dm.bindPopup(
      '<div style="font-family:-apple-system,sans-serif;min-width:155px">'
      +'<div style="font-size:11px;color:'+j.color+';font-weight:700;margin-bottom:2px">'+j.name+'</div>'
      +'<div style="font-size:13px;font-weight:700;margin-bottom:3px">'+d.nm+'</div>'
      +'<div style="font-size:11px;color:#555">CSR: <b style="color:'+color+'">'+d.csr+'</b></div>'
      +'</div>',{maxWidth:220}
    );
    detailGrp[j.name].addLayer(dm);
  });
  overviewGrp[j.name].addTo(map);
});

/* ── 지사 선택/해제 ──────────────────────────────────── */
let sel=null;
function selectJisa(name){
  sel=name;
  // 다른 지사 흐리게 + 마커 숨김
  JISA.forEach(j=>{
    overviewGrp[j.name].remove();
    if(j.name===name){
      polyLayer[j.name].setStyle({fillOpacity:0.3,weight:3,opacity:1});
      detailGrp[j.name].addTo(map);
    } else {
      polyLayer[j.name].setStyle({fillOpacity:0.04,weight:1,opacity:0.3,color:'#999'});
      detailGrp[j.name].remove();
    }
  });
  map.fitBounds(polyLayer[name].getBounds(),{padding:[40,40]});
  document.getElementById('topSub').textContent=name+' — '+jM[name].dealers.length+'개 대리점';
  showDetail(name);
  if(document.getElementById('sp').classList.contains('hide'))togglePanel();
}
function backToOverview(){
  sel=null;
  JISA.forEach(j=>{
    detailGrp[j.name].remove();
    overviewGrp[j.name].addTo(map);
    polyLayer[j.name].setStyle({fillOpacity:0.2,weight:2,opacity:0.85,color:j.color});
  });
  map.fitBounds(KOREA_BOUNDS);
  document.getElementById('topSub').textContent='전체 11개 지사';
  renderOverview();
}

/* ── 범례 ──────────────────────────────────────────────── */
const legEl=document.getElementById('legItems');
JISA.forEach(j=>{
  legEl.innerHTML+='<div class="lI" onclick="selectJisa(\''+j.name+'\')">'
    +'<div class="lD" style="background:'+j.color+'"></div>'
    +'<span>'+j.name+'</span></div>';
});

/* ── 패널: 전체보기 ─────────────────────────────────────── */
function renderOverview(){
  let h='<div class="ph"><h2>🗺️ 지사별 담당지역</h2><div class="phSub">지사 클릭 → 상세 보기</div></div><div class="pb">';
  KWANYUK.forEach(kw=>{
    h+='<div class="kwSep" style="color:'+kw.color+';border-color:'+kw.color+'">'+kw.name+'</div>';
    kw.jisas.forEach(jn=>{
      const ji=jM[jn];if(!ji)return;
      const spKeys=Object.keys(ji.spSt).filter(s=>s).sort();
      const chips=spKeys.map(sp=>'<span class="spC" style="background:'+ji.spColors[sp]+'15;border-color:'+ji.spColors[sp]+'55;color:'+ji.spColors[sp]+'">'+sp+'</span>').join('');
      h+='<div class="jiRow" style="border-color:'+ji.color+'" onclick="selectJisa(\''+jn+'\')">'
        +'<span class="jiName" style="color:'+ji.color+'">'+jn+'</span>'
        +'<span class="jiCnt" style="color:'+ji.color+'">'+ji.dealers.length+'개</span>'
        +'<div class="spW">'+chips+'</div>'
        +'<span style="font-size:10px;color:#bbb">▶</span></div>';
    });
    h+='<div style="margin-bottom:6px"></div>';
  });
  h+='</div>';
  document.getElementById('panelContent').innerHTML=h;
}

/* ── 패널: 지사 상세 ────────────────────────────────────── */
function showDetail(name){
  const ji=jM[name];if(!ji)return;
  const spKeys=Object.keys(ji.spSt).filter(s=>s).sort();
  let h='<div class="dh" style="background:'+ji.color+'">'
    +'<button class="bk" onclick="backToOverview()">← 전체</button>'
    +'<span style="font-weight:700;font-size:13px">'+name+'</span>'
    +'<span style="margin-left:auto;font-size:12px">'+ji.dealers.length+'개</span>'
    +'</div><div class="pb">';
  spKeys.forEach(sp=>{
    const c=ji.spColors[sp]||ji.color;
    const dls=ji.spSt[sp];
    h+='<div class="spBlk"><div class="spT"><div class="spDot" style="background:'+c+'"></div>'
      +'<span style="font-size:12px;font-weight:700;color:'+c+'">'+sp+'</span>'
      +'<span style="font-size:10px;color:#999">('+dls.length+'개)</span></div>'
      +'<div class="chips">'+dls.map(d=>'<span class="chip" style="background:'+c+'10;border-color:'+c+'40;color:#444">'+d.shortName+'</span>').join('')+'</div></div>';
  });
  h+='</div>';
  document.getElementById('panelContent').innerHTML=h;
}

/* ── 패널 토글 ─────────────────────────────────────────── */
let pOpen=true;
function togglePanel(){
  pOpen=!pOpen;
  document.getElementById('sp').classList.toggle('hide',!pOpen);
  const b=document.getElementById('toggleBtn');
  b.classList.toggle('col',!pOpen);
  b.textContent=pOpen?'◀ 목록':'▶ 목록';
  b.style.right=pOpen?'275px':'10px';
}

renderOverview();
</script>
</body>
</html>
