<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지사별 대리점 지도 데모</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f5f6f9}
#mapWrap{position:relative;width:100%;height:100vh;display:flex;flex-direction:column}
#topBar{background:linear-gradient(135deg,#1a3a5c,#2563eb);color:#fff;padding:10px 14px;z-index:1000;display:flex;align-items:center;gap:10px;flex-shrink:0}
#topBar h1{font-size:14px;font-weight:700}
#topBar span{font-size:11px;opacity:.7}
#map{flex:1}
#sidePanel{position:absolute;top:52px;right:0;bottom:0;width:260px;background:#fff;box-shadow:-2px 0 8px rgba(0,0,0,.12);overflow-y:auto;z-index:900;transform:translateX(0);transition:transform .25s}
#sidePanel.hidden{transform:translateX(100%)}
#sidePanelInner{padding:10px}
#toggleBtn{position:absolute;top:62px;right:270px;z-index:901;background:#fff;border:1px solid #ddd;border-radius:6px 0 0 6px;padding:6px 8px;cursor:pointer;font-size:12px;box-shadow:-2px 1px 5px rgba(0,0,0,.1);transition:right .25s}
#toggleBtn.collapsed{right:10px}
.kwHead{font-size:11px;font-weight:700;padding:6px 4px 3px;border-bottom:2px solid currentColor;margin-bottom:5px;letter-spacing:.5px}
.jiCard{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#f8f9fb;border-left:3px solid;border-radius:5px;margin-bottom:5px;cursor:pointer;transition:background .15s}
.jiCard:hover{background:#eef2ff}
.jiCard .jn{font-size:12px;font-weight:700}
.jiCard .jc{font-size:10px;font-weight:700}
.jiCard .sp{flex:1;display:flex;flex-wrap:wrap;gap:2px}
.jiCard .sp span{font-size:9px;border-radius:5px;padding:1px 4px;border:1px solid}
#detailPanel{display:none;padding:8px}
.detailHead{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px 8px 0 0;margin-bottom:0}
.detailHead .backBtn{font-size:11px;cursor:pointer;padding:3px 8px;border:1px solid rgba(255,255,255,.5);border-radius:5px;background:rgba(255,255,255,.15);color:#fff}
.spBlock{margin-bottom:10px}
.spTitle{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.spTitle .dot{width:9px;height:9px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:3px;padding-left:15px}
.chips span{font-size:9px;border-radius:4px;padding:2px 5px;border:1px solid}
#apiNote{position:absolute;bottom:10px;left:10px;z-index:999;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:6px 10px;border-radius:6px;max-width:280px;line-height:1.5}
</style>
</head>
<body>
<div id="mapWrap">
  <div id="topBar">
    <h1>🗺️ 지사별 대리점 지도 데모</h1>
    <span>Leaflet.js + OpenStreetMap (무료, 키 불필요)</span>
  </div>
  <div id="map"></div>
  <button id="toggleBtn" onclick="togglePanel()">◀ 목록</button>
  <div id="sidePanel">
    <div id="overviewPanel" id="sidePanelInner"></div>
    <div id="detailPanel"></div>
  </div>
  <div id="apiNote">
    ℹ️ 현재: OpenStreetMap 무료 타일<br>
    카카오맵/네이버맵으로 교체 시 타일 URL만 변경하면 됩니다.<br>
    지도 품질·한국어 주소 검색 등이 훨씬 좋아집니다.
  </div>
</div>

function extractCity(n){
  n=n.replace(/\(.*?\)/g,'').trim();
  n=n.replace(/대리점$|특약점$|지점$|판매점$/,'');
  n=n.replace(/동부$|서부$|남부$|북부$|중부$|제일$|중앙$/,'');
  return n.trim()||'기타';
}
function cityXY(name, fallback){
  if(CITY_XY[name])return CITY_XY[name];
  const k=Object.keys(CITY_XY).find(k=>name.startsWith(k)&&k.length>=2);
  if(k){const[x,y]=CITY_XY[k];return[x+(name.charCodeAt(name.length-1)%7)-3,y+(name.charCodeAt(0)%7)-3];}
  return fallback;
}

// Build jisaInfo
const jisaMap={};
JISA_DATA.forEach(j=>{jisaMap[j.name]={...j,dealers:[],spSt:{},spColors:{}};});
DEALERS.forEach(([branch,name,csr])=>{
  if(!jisaMap[branch])return;
  jisaMap[branch].dealers.push({branch,name,consultant:csr});
  if(!jisaMap[branch].spSt[csr])jisaMap[branch].spSt[csr]=[];
  jisaMap[branch].spSt[csr].push({branch,name,consultant:csr});
});
JISA_DATA.forEach(j=>{
  const spList=Object.keys(jisaMap[j.name].spSt).filter(s=>s).sort();
  spList.forEach((sp,idx)=>{jisaMap[j.name].spColors[sp]=SP_COLORS[idx%SP_COLORS.length];});
});

// Init map
const map=L.map('map',{zoomControl:true}).setView([36.5,127.8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom:18
}).addTo(map);

// Layer groups per jisa
const layerGroups={};
JISA_DATA.forEach(j=>{layerGroups[j.name]=L.layerGroup().addTo(map);});

// Add markers
let currentZoom=null;
DEALERS.forEach(([branch,name,csr])=>{
  const ji=jisaMap[branch];
  if(!ji)return;
  const city=extractCity(name);
  const fallback=[ji.lx,ji.ly];
  const [sx,sy]=cityXY(city,fallback);
  const [lat,lng]=svgLL(sx,sy);
  const color=ji.spColors[csr]||ji.color;
  const marker=L.circleMarker([lat,lng],{
    radius:7,
    fillColor:color,
    color:'#fff',
    weight:2,
    opacity:1,
    fillOpacity:0.9
  });
  marker.bindPopup('<div style="min-width:140px"><b style="color:'+ji.color+'">'+branch+'</b><br><span style="font-size:12px">'+name+'</span><br><span style="font-size:11px;color:#666">CSR: '+csr+'</span></div>');
  marker.on('click',()=>{showDetail(branch);});
  layerGroups[branch].addLayer(marker);
});

// Layer control
const overlays={};
JISA_DATA.forEach(j=>{overlays['<span style="color:'+j.color+';font-weight:700">'+j.name+'</span>']=layerGroups[j.name];});
L.control.layers(null,overlays,{collapsed:false,position:'bottomleft'}).addTo(map);

// Side panel
function buildOverview(){
  let h='<div style="padding:10px">';
  h+='<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:#1a3a5c">🗺️ 지사별 담당지역</div>';
  KWANYUK.forEach(kw=>{
    h+='<div class="kwHead" style="color:'+kw.color+';border-color:'+kw.color+'">'+kw.name+'</div>';
    kw.jisas.forEach(jname=>{
      const ji=jisaMap[jname];if(!ji)return;
      const spKeys=Object.keys(ji.spSt).filter(s=>s).sort();
      const spChips=spKeys.map(sp=>'<span style="background:'+ji.spColors[sp]+'15;border-color:'+ji.spColors[sp]+'55;color:'+ji.spColors[sp]+'">'+sp+'</span>').join('');
      h+='<div class="jiCard" style="border-color:'+ji.color+'" onclick="showDetail(\''+jname+'\');flyTo(\''+jname+'\')">'
        +'<span class="jn" style="color:'+ji.color+'">'+jname+'</span>'
        +'<span class="jc" style="color:'+ji.color+'">'+ji.dealers.length+'개</span>'
        +'<div class="sp">'+spChips+'</div>'
        +'<span style="font-size:10px;color:#aaa">▶</span>'
        +'</div>';
    });
    h+='<div style="margin-bottom:8px"></div>';
  });
  h+='</div>';
  return h;
}

function showDetail(branch){
  const ji=jisaMap[branch];if(!ji)return;
  currentZoom=branch;
  document.getElementById('overviewPanel').style.display='none';
  const dp=document.getElementById('detailPanel');
  dp.style.display='block';
  const spKeys=Object.keys(ji.spSt).filter(s=>s).sort();
  let h='<div class="detailHead" style="background:'+ji.color+';color:#fff">'
    +'<button class="backBtn" onclick="backToOverview()">← 전체</button>'
    +'<span style="font-weight:700;font-size:13px">'+branch+'</span>'
    +'<span style="margin-left:auto;font-size:12px">'+ji.dealers.length+'개</span>'
    +'</div>';
  h+='<div style="padding:10px">';
  spKeys.forEach(sp=>{
    const color=ji.spColors[sp]||ji.color;
    const dls=ji.spSt[sp];
    h+='<div class="spBlock">'
      +'<div class="spTitle"><div class="dot" style="background:'+color+'"></div><span style="font-size:12px;font-weight:700;color:'+color+'">'+sp+'</span><span style="font-size:10px;color:#999">('+dls.length+'개)</span></div>'
      +'<div class="chips">'+dls.map(d=>'<span style="background:'+color+'10;border-color:'+color+'40;color:#444">'+d.name.replace(/\(.*?\)/g,'').replace(/대리점$|특약점$|지점$|판매점$/,'')+'</span>').join('')+'</div>'
      +'</div>';
  });
  h+='</div>';
  dp.innerHTML=h;
}

function backToOverview(){
  currentZoom=null;
  document.getElementById('detailPanel').style.display='none';
  document.getElementById('overviewPanel').style.display='block';
  map.setView([36.5,127.8],7);
}

function flyTo(branch){
  const ji=jisaMap[branch];if(!ji)return;
  const [lat,lng]=svgLL(ji.lx,ji.ly);
  map.flyTo([lat,lng],10,{duration:1.2});
}

let panelOpen=true;
function togglePanel(){
  panelOpen=!panelOpen;
  const p=document.getElementById('sidePanel');
  const b=document.getElementById('toggleBtn');
  if(panelOpen){p.classList.remove('hidden');b.classList.remove('collapsed');b.textContent='◀ 목록';}
  else{p.classList.add('hidden');b.classList.add('collapsed');b.textContent='▶ 목록';}
}

document.getElementById('overviewPanel').innerHTML=buildOverview();
