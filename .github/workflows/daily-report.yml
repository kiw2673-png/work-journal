name: CS업무일지 일일보고 텔레그램 전송

on:
  schedule:
    # 평일 15분마다 실행 — 스크립트가 Firestore의 tgAutoTime(19:00)과 비교 후 전송
    # (GitHub Actions의 schedule 트리거는 지연이 심할 수 있어, 지연 폭을 줄이기 위해 자주 체크함)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:  # 수동 테스트용

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 일일보고 전송
        run: node scripts/send-daily-report.js
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
