name: CS업무일지 일일보고 텔레그램 전송

on:
  schedule:
    # 목표: 매일 아침 08:30 KST(= 전날 23:30 UTC) 이후 "전날 보고서" 전송 (tgAutoTime=08:30, Firestore 설정).
    # 다음날 아침 소급 작성분까지 포함하기 위해 2026-09-17에 저녁 21시 → 다음날 아침 방식으로 변경.
    # KST 화~토 아침 = UTC 월~금 23시 / 화~토 00시. 대상일이 주말·공휴일이면 스크립트가 스킵.
    # 08:31~08:58 KST 집중 체크(3분 간격):
    - cron: '31-59/3 23 * * 1-5'
    # 09:00~09:30 KST 집중 체크:
    - cron: '0-30/3 0 * * 2-6'
    # 10:00~23:30 KST 30분 간격 폴백 (GitHub 지연 시 캐치업):
    - cron: '*/30 1-14 * * 2-6'
  workflow_dispatch:  # 수동 테스트용

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 일일보고 전송
        run: node scripts/send-daily-report.js
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
